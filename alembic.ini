[alembic]
# 迁移脚本目录
script_location = alembic
# 保证从项目根目录运行时可导入 app 包
prepend_sys_path = .
# 数据库连接由环境变量 DATABASE_URL 提供（见 alembic/env.py）
sqlalchemy.url =

[post_write_hooks]
# 预留：后续可配置格式化钩子

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
