# 本地演示用 Docker Compose 配置：PostgreSQL + legacy n8n。
# 当前主 n8n 是手动容器 ai-support-n8n-manual-stage6（宿主机 5679）。
# 全部为演示默认值，不包含任何真实密钥；生产环境请自行修改并启用鉴权。

services:
  db:
    image: postgres:16-alpine
    container_name: ai-support-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
      POSTGRES_DB: ${POSTGRES_DB:-ai_support}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demo} -d ${POSTGRES_DB:-ai_support}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 5678 已退役：当前主 n8n 是手动容器 ai-support-n8n-manual-stage6（宿主机 5679）。
  # 如需临时启动旧 compose n8n，显式使用：
  # docker compose --profile legacy up -d n8n
  n8n:
    profiles: ["legacy"]
    image: n8nio/n8n:latest
    container_name: ai-support-n8n
    environment:
      N8N_PORT: "5678"
      GENERIC_TIMEZONE: Asia/Shanghai
      # 本地演示默认不开启登录鉴权；生产环境务必设置强密码并开启鉴权。
      N8N_BASIC_AUTH_ACTIVE: "false"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pgdata:
  n8n_data:
